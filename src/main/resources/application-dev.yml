# ── Dev Profile ─────────────────────────────────────────────
# Activated by setting: spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartlms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
    username: root
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8008

logging:
  level:
    com.smartlms: DEBUG
